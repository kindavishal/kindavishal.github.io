<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Three-stage pipeline: Apps Script collects, Sheets stores, Looker Studio reads. Build order: outcomes, ref codes, events, people, attribution." style="display:block;width:100%;height:auto;background:#F4EFE6;border:1px solid #D9D0BD;border-radius:8px">

<text x="40" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#8A8072" letter-spacing="1.5">THREE TOOLS · NO ENGINEERING TICKET</text>
<text x="40" y="80" font-family="'Literata', Georgia, serif" font-size="22" fill="#1A1815">The pipeline you can build in an afternoon.</text>
<text x="860" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="end" letter-spacing="1.5">MID-POST</text>
<rect x="40" y="110" width="240" height="150" fill="none" fill-opacity="1" stroke="#D9D0BD"/><text x="56" y="132" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#B8532E" letter-spacing="1.2">01 · COLLECT</text><text x="56" y="160" font-family="'Literata', Georgia, serif" font-size="18" fill="#1A1815">Apps Script</text><text x="56" y="188" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">One function per source.</text><text x="56" y="206" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">Fetch and clean up in</text><text x="56" y="224" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">separate functions. Scheduled</text><text x="56" y="242" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">triggers.</text><text x="300" y="190" font-family="'Space Grotesk', ui-monospace, monospace" font-size="18" fill="#8A8072" text-anchor="middle">→</text><rect x="320" y="110" width="240" height="150" fill="none" fill-opacity="1" stroke="#D9D0BD"/><text x="336" y="132" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#B8532E" letter-spacing="1.2">02 · STORE</text><text x="336" y="160" font-family="'Literata', Georgia, serif" font-size="18" fill="#1A1815">Sheets</text><text x="336" y="188" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">Not the right database — the</text><text x="336" y="206" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">one everyone can read.</text><text x="336" y="224" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">Migrates to BigQuery</text><text x="336" y="242" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">unchanged.</text><text x="580" y="190" font-family="'Space Grotesk', ui-monospace, monospace" font-size="18" fill="#8A8072" text-anchor="middle">→</text><rect x="600" y="110" width="240" height="150" fill="#B8532E" fill-opacity="0.06" stroke="#D9D0BD"/><text x="616" y="132" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#B8532E" letter-spacing="1.2">03 · READ</text><text x="616" y="160" font-family="'Literata', Georgia, serif" font-size="18" fill="#1A1815">Looker Studio</text><text x="616" y="188" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">One page per question, not</text><text x="616" y="206" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">per source. Answers 'who do</text><text x="616" y="224" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">we pay this month' on one</text><text x="616" y="242" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">screen.</text>
<line x1="40" y1="290" x2="860" y2="290" stroke="#D9D0BD"/>
<text x="40" y="315" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#6A6355" letter-spacing="1.2">BUILD ORDER</text>
<g font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815" transform="translate(40 345)">
  <text x="0" y="0">1 · outcomes</text>
  <text x="160" y="0">2 · ref_codes on links</text>
  <text x="360" y="0">3 · events raw</text>
  <text x="520" y="0">4 · people, then attribution</text>
</g>

</svg>