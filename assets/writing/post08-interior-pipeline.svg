<svg xmlns="http://www.w3.org/2000/svg" aria-label="Three-stage pipeline: Apps Script collects, Sheets stores, Looker Studio reads. Build order: outcomes, ref codes, events, people, attribution." style="display:block;width:100%;height:auto;background:#f4efe6;border:1px solid #d9d0bd;border-radius:8px" viewBox="0 0 900 380"><text x="40" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" letter-spacing="1.5">THREE TOOLS · NO ENGINEERING TICKET</text><text x="40" y="80" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="22">The pipeline you can build in an afternoon.</text><text x="860" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.5" text-anchor="end">MID-POST</text><path fill="none" stroke="#d9d0bd" d="M40 110h240v150H40z"/><text x="56" y="132" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">01 · COLLECT</text><text x="56" y="160" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="18">Apps Script</text><text x="56" y="188" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">One function per source.</text><text x="56" y="206" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">Fetch and clean up in</text><text x="56" y="224" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">separate functions. Scheduled</text><text x="56" y="242" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">triggers.</text><text x="300" y="190" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="18" text-anchor="middle">→</text><path fill="none" stroke="#d9d0bd" d="M320 110h240v150H320z"/><text x="336" y="132" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">02 · STORE</text><text x="336" y="160" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="18">Sheets</text><text x="336" y="188" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">Not the right database — the</text><text x="336" y="206" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">one everyone can read.</text><text x="336" y="224" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">Migrates to BigQuery</text><text x="336" y="242" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">unchanged.</text><text x="580" y="190" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="18" text-anchor="middle">→</text><path fill="#b8532e" fill-opacity=".06" stroke="#d9d0bd" d="M600 110h240v150H600z"/><text x="616" y="132" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">03 · READ</text><text x="616" y="160" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="18">Looker Studio</text><text x="616" y="188" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">One page per question, not</text><text x="616" y="206" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">per source. Answers &apos;who do</text><text x="616" y="224" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">we pay this month&apos; on one</text><text x="616" y="242" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">screen.</text><path stroke="#d9d0bd" d="M40 290h820"/><text x="40" y="315" fill="#6a6355" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" letter-spacing="1.2">BUILD ORDER</text><g fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12"><text transform="translate(40 345)">1 · outcomes</text><text x="160" transform="translate(40 345)">2 · ref_codes on links</text><text x="360" transform="translate(40 345)">3 · events raw</text><text x="520" transform="translate(40 345)">4 · people, then attribution</text></g></svg>