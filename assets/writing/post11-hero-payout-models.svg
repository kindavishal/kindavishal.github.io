<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="Pay-per-view vs pay-per-video: same spend, very different content shape and creator risk." style="display:block;width:100%;height:auto;background:#F4EFE6;border:1px solid #D9D0BD;border-radius:8px">

<text x="40" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#8A8072" letter-spacing="1.5">TWO PAYOUT MODELS · SAME $ POOL</text>
<text x="40" y="80" font-family="'Literata', Georgia, serif" font-size="22" fill="#1A1815">If you pay for thumbnails, you get thumbnails.</text>
<text x="860" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="end" letter-spacing="1.5">HERO</text>

<text x="40" y="115" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#6A6355" letter-spacing="1.2">PAY PER VIEW · $ / VIEW</text>
<rect x="40" y="131" width="380" height="38" fill="#ECE6DA"/><text x="52" y="157" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#1A1815">Optimises for</text><text x="408" y="157" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#6A6355" text-anchor="end">clicks, thumbnails, hooks</text><rect x="40" y="177" width="380" height="38" fill="none"/><text x="52" y="203" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#1A1815">Content shape</text><text x="408" y="203" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#6A6355" text-anchor="end">short, punchy, surface</text><rect x="40" y="223" width="380" height="38" fill="#ECE6DA"/><text x="52" y="249" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#1A1815">Technical depth</text><text x="408" y="249" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#6A6355" text-anchor="end">thin — hurts CTR</text><rect x="40" y="269" width="380" height="38" fill="none"/><text x="52" y="295" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#1A1815">Reuse by the model</text><text x="408" y="295" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#6A6355" text-anchor="end">low — nothing to cite</text><rect x="40" y="315" width="380" height="38" fill="#ECE6DA"/><text x="52" y="341" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#1A1815">Risk to creator</text><text x="408" y="341" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#6A6355" text-anchor="end">payout depends on algo luck</text>

<line x1="450" y1="105" x2="450" y2="410" stroke="#D9D0BD"/>

<text x="470" y="115" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#B8532E" letter-spacing="1.2">PAY PER VIDEO · $ / SHIPPED PIECE</text>
<rect x="470" y="131" width="380" height="38" fill="rgba(184,83,46,0.06)"/><text x="482" y="157" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#1A1815">Optimises for</text><text x="838" y="157" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#B8532E" text-anchor="end">the artefact itself</text><rect x="470" y="177" width="380" height="38" fill="none"/><text x="482" y="203" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#1A1815">Content shape</text><text x="838" y="203" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#B8532E" text-anchor="end">tutorial, walkthrough, build</text><rect x="470" y="223" width="380" height="38" fill="rgba(184,83,46,0.06)"/><text x="482" y="249" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#1A1815">Technical depth</text><text x="838" y="249" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#B8532E" text-anchor="end">high — the reason you paid</text><rect x="470" y="269" width="380" height="38" fill="none"/><text x="482" y="295" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#1A1815">Reuse by the model</text><text x="838" y="295" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#B8532E" text-anchor="end">high — specific, citable</text><rect x="470" y="315" width="380" height="38" fill="rgba(184,83,46,0.06)"/><text x="482" y="341" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#1A1815">Risk to creator</text><text x="838" y="341" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#B8532E" text-anchor="end">bounded — known before shooting</text>

</svg>