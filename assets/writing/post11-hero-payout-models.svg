<svg xmlns="http://www.w3.org/2000/svg" aria-label="Pay-per-view vs pay-per-video: same spend, very different content shape and creator risk." style="display:block;width:100%;height:auto;background:#f4efe6;border:1px solid #d9d0bd;border-radius:8px" viewBox="0 0 900 500"><text x="40" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" letter-spacing="1.5">TWO PAYOUT MODELS · SAME $ POOL</text><text x="40" y="80" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="22">If you pay for thumbnails, you get thumbnails.</text><text x="860" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.5" text-anchor="end">HERO</text><text x="40" y="115" fill="#6a6355" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">PAY PER VIEW · $ / VIEW</text><path fill="#ece6da" d="M40 131h380v38H40z"/><text x="52" y="157" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">Optimises for</text><text x="408" y="157" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" text-anchor="end">clicks, thumbnails, hooks</text><path fill="none" d="M40 177h380v38H40z"/><text x="52" y="203" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">Content shape</text><text x="408" y="203" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" text-anchor="end">short, punchy, surface</text><path fill="#ece6da" d="M40 223h380v38H40z"/><text x="52" y="249" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">Technical depth</text><text x="408" y="249" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" text-anchor="end">thin — hurts CTR</text><path fill="none" d="M40 269h380v38H40z"/><text x="52" y="295" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">Reuse by the model</text><text x="408" y="295" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" text-anchor="end">low — nothing to cite</text><path fill="#ece6da" d="M40 315h380v38H40z"/><text x="52" y="341" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">Risk to creator</text><text x="408" y="341" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" text-anchor="end">payout depends on algo luck</text><path stroke="#d9d0bd" d="M450 105v305"/><text x="470" y="115" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">PAY PER VIDEO · $ / SHIPPED PIECE</text><path fill="rgba(184,83,46,0.06)" d="M470 131h380v38H470z"/><text x="482" y="157" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">Optimises for</text><text x="838" y="157" fill="#b8532e" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" text-anchor="end">the artefact itself</text><path fill="none" d="M470 177h380v38H470z"/><text x="482" y="203" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">Content shape</text><text x="838" y="203" fill="#b8532e" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" text-anchor="end">tutorial, walkthrough, build</text><path fill="rgba(184,83,46,0.06)" d="M470 223h380v38H470z"/><text x="482" y="249" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">Technical depth</text><text x="838" y="249" fill="#b8532e" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" text-anchor="end">high — the reason you paid</text><path fill="none" d="M470 269h380v38H470z"/><text x="482" y="295" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">Reuse by the model</text><text x="838" y="295" fill="#b8532e" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" text-anchor="end">high — specific, citable</text><path fill="rgba(184,83,46,0.06)" d="M470 315h380v38H470z"/><text x="482" y="341" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">Risk to creator</text><text x="838" y="341" fill="#b8532e" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" text-anchor="end">bounded — known before shooting</text></svg>