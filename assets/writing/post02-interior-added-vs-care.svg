<svg xmlns="http://www.w3.org/2000/svg" aria-label="Members added grows steeply while members who care stays flat" style="display:block;width:100%;height:auto;background:#f4efe6;border:1px solid #d9d0bd;border-radius:8px" viewBox="0 0 900 380"><text x="40" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" letter-spacing="1.5">TWO WEEKS · SAME PROGRAMME</text><text x="40" y="80" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="22">You can add fifty people. You cannot make fifty people care.</text><text x="860" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.5" text-anchor="end">MID-POST</text><path stroke="#d9d0bd" d="M60 130v180m0 0h800"/><path stroke="#d9d0bd" stroke-opacity=".4" d="M174.3 130v180m114.3-180v180m114.3-180v180m114.2-180v180m114.3-180v180m114.3-180v180"/><path fill="none" stroke="#6a6355" stroke-width="2" d="m60 300 114.3-20 114.3-30 114.3-30 114.2-30 114.3-25 114.3-17 114.3-8"/><path fill="none" stroke="#b8532e" stroke-width="2.5" d="m60 298 114.3-4 114.3-4 114.3-2 114.2-2 114.3-1 114.3-2 114.3-1"/><text x="850" y="145" fill="#6a6355" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" text-anchor="end">members added</text><text x="850" y="270" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" text-anchor="end">members who care</text><text x="60" y="328" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10">day 0</text><text x="288.6" y="328" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" text-anchor="middle">day 4</text><text x="517.1" y="328" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" text-anchor="middle">day 8</text><text x="745.7" y="328" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" text-anchor="middle">day 12</text><text x="860" y="328" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" text-anchor="end">day 14</text><path stroke="#6a6355" stroke-width="2" d="M40 331v38"/><text x="10" y="-2" fill="#6a6355" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2" transform="translate(40 345)">EASY TO MOVE</text><text x="10" y="16" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(40 345)">Member count. Reports well. One number answers &quot;how&apos;s it going?&quot;</text><path stroke="#b8532e" stroke-width="2" d="M470 331v38"/><text x="10" y="-2" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2" transform="translate(470 345)">TAKES A PARAGRAPH</text><text x="10" y="16" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(470 345)">Whether they do the thing. Doesn&apos;t move on the reporting schedule.</text></svg>