<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Members added grows steeply while members who care stays flat" style="display:block;width:100%;height:auto;background:#F4EFE6;border:1px solid #D9D0BD;border-radius:8px">

<text x="40" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#8A8072" letter-spacing="1.5">TWO WEEKS · SAME PROGRAMME</text>
<text x="40" y="80" font-family="'Literata', Georgia, serif" font-size="22" fill="#1A1815">You can add fifty people. You cannot make fifty people care.</text>
<text x="860" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="end" letter-spacing="1.5">MID-POST</text>

<!-- axes -->
<line x1="60" y1="130" x2="60" y2="310" stroke="#D9D0BD"/>
<line x1="60" y1="310" x2="860" y2="310" stroke="#D9D0BD"/>

<!-- gridlines -->
<line x1="174.3" y1="130" x2="174.3" y2="310" stroke="#D9D0BD" stroke-opacity="0.4"/><line x1="288.6" y1="130" x2="288.6" y2="310" stroke="#D9D0BD" stroke-opacity="0.4"/><line x1="402.9" y1="130" x2="402.9" y2="310" stroke="#D9D0BD" stroke-opacity="0.4"/><line x1="517.1" y1="130" x2="517.1" y2="310" stroke="#D9D0BD" stroke-opacity="0.4"/><line x1="631.4" y1="130" x2="631.4" y2="310" stroke="#D9D0BD" stroke-opacity="0.4"/><line x1="745.7" y1="130" x2="745.7" y2="310" stroke="#D9D0BD" stroke-opacity="0.4"/>

<!-- members added (steep, muted) -->
<polyline points="60,300 174.3,280.0 288.6,250.0 402.9,220.0 517.1,190.0 631.4,165.0 745.7,148.0 860,140.0" fill="none" stroke="#6A6355" stroke-width="2"/>

<!-- members who care (flat, accent) -->
<polyline points="60,298 174.3,294.0 288.6,290.0 402.9,288.0 517.1,286.0 631.4,285.0 745.7,283.0 860,282.0" fill="none" stroke="#B8532E" stroke-width="2.5"/>

<!-- line labels -->
<text x="850" y="145" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#6A6355" text-anchor="end">members added</text>
<text x="850" y="270" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#B8532E" text-anchor="end">members who care</text>

<!-- x-labels -->
<text x="60" y="328" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072">day 0</text>
<text x="288.6" y="328" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="middle">day 4</text>
<text x="517.1" y="328" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="middle">day 8</text>
<text x="745.7" y="328" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="middle">day 12</text>
<text x="860" y="328" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="end">day 14</text>

<!-- two takeaway cards -->
<g transform="translate(40 345)">
  <line x1="0" y1="-14" x2="0" y2="24" stroke="#6A6355" stroke-width="2"/>
  <text x="10" y="-2" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#6A6355" letter-spacing="1.2">EASY TO MOVE</text>
  <text x="10" y="16" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">Member count. Reports well. One number answers "how's it going?"</text>
</g>
<g transform="translate(470 345)">
  <line x1="0" y1="-14" x2="0" y2="24" stroke="#B8532E" stroke-width="2"/>
  <text x="10" y="-2" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#B8532E" letter-spacing="1.2">TAKES A PARAGRAPH</text>
  <text x="10" y="16" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">Whether they do the thing. Doesn't move on the reporting schedule.</text>
</g>

</svg>