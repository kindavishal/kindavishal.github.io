<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="Four-table schema for community attribution: people, events, attribution, outcomes — each with one row per thing." style="display:block;width:100%;height:auto;background:#F4EFE6;border:1px solid #D9D0BD;border-radius:8px">

<text x="40" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#8A8072" letter-spacing="1.5">FOUR TABLES · ONE ROW PER THING</text>
<text x="40" y="80" font-family="'Literata', Georgia, serif" font-size="22" fill="#1A1815">Community action → business result, one person at a time.</text>
<text x="860" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="end" letter-spacing="1.5">HERO</text>
<rect x="40" y="110" width="200" height="260" fill="#ECE6DA" stroke="#6A6355"/><text x="56" y="138" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#B8532E">people</text><text x="56" y="158" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" fill="#8A8072">one row per human</text><line x1="56" y1="172" x2="224" y2="172" stroke="#D9D0BD"/><text x="56" y="196" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#1A1815">person_id</text><text x="56" y="216" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#1A1815">emails[]</text><text x="56" y="236" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#1A1815">handles{}</text><text x="56" y="256" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#1A1815">first_seen</text><rect x="250" y="110" width="200" height="260" fill="#ECE6DA" stroke="#6A6355"/><text x="266" y="138" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#B8532E">events</text><text x="266" y="158" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" fill="#8A8072">one row per action</text><line x1="266" y1="172" x2="434" y2="172" stroke="#D9D0BD"/><text x="266" y="196" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#1A1815">event_id</text><text x="266" y="216" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#1A1815">person_id →</text><text x="266" y="236" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#1A1815">type · source</text><text x="266" y="256" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#1A1815">timestamp</text><text x="266" y="276" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#1A1815">ref_code</text><rect x="460" y="110" width="200" height="260" fill="#ECE6DA" stroke="#6A6355"/><text x="476" y="138" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#B8532E">attribution</text><text x="476" y="158" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" fill="#8A8072">one row per credit</text><line x1="476" y1="172" x2="644" y2="172" stroke="#D9D0BD"/><text x="476" y="196" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#1A1815">event_id →</text><text x="476" y="216" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#1A1815">partner_id</text><text x="476" y="236" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#1A1815">model</text><text x="476" y="256" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#1A1815">weight</text><rect x="670" y="110" width="200" height="260" fill="#ECE6DA" stroke="#6A6355"/><text x="686" y="138" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#B8532E">outcomes</text><text x="686" y="158" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" fill="#8A8072">one row per result</text><line x1="686" y1="172" x2="854" y2="172" stroke="#D9D0BD"/><text x="686" y="196" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#1A1815">outcome_id</text><text x="686" y="216" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#1A1815">person_id →</text><text x="686" y="236" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#1A1815">type · value</text><text x="686" y="256" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#1A1815">timestamp</text>
<line x1="40" y1="400" x2="860" y2="400" stroke="#D9D0BD"/>
<g font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815" transform="translate(40 428)">
  <text x="0" y="0"><tspan font-family="'Space Grotesk', ui-monospace, monospace" fill="#B8532E">→</tspan>  foreign key</text>
  <text x="180" y="0"><tspan font-family="'Space Grotesk', ui-monospace, monospace" fill="#B8532E">◆</tspan>  never summarised at write</text>
  <text x="440" y="0"><tspan font-family="'Space Grotesk', ui-monospace, monospace" fill="#B8532E">◆</tspan>  attribution separate from events</text>
</g>

</svg>