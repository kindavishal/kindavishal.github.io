<svg xmlns="http://www.w3.org/2000/svg" aria-label="Four-table schema for community attribution: people, events, attribution, outcomes — each with one row per thing." style="display:block;width:100%;height:auto;background:#f4efe6;border:1px solid #d9d0bd;border-radius:8px" viewBox="0 0 900 460"><text x="40" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" letter-spacing="1.5">FOUR TABLES · ONE ROW PER THING</text><text x="40" y="80" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="22">Community action → business result, one person at a time.</text><text x="860" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.5" text-anchor="end">HERO</text><path fill="#ece6da" stroke="#6a6355" d="M40 110h200v260H40z"/><text x="56" y="138" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">people</text><text x="56" y="158" fill="#8a8072" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11">one row per human</text><path stroke="#d9d0bd" d="M56 172h168"/><text x="56" y="196" fill="#1a1815" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">person_id</text><text x="56" y="216" fill="#1a1815" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">emails[]</text><text x="56" y="236" fill="#1a1815" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">handles{}</text><text x="56" y="256" fill="#1a1815" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">first_seen</text><path fill="#ece6da" stroke="#6a6355" d="M250 110h200v260H250z"/><text x="266" y="138" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">events</text><text x="266" y="158" fill="#8a8072" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11">one row per action</text><path stroke="#d9d0bd" d="M266 172h168"/><text x="266" y="196" fill="#1a1815" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">event_id</text><text x="266" y="216" fill="#1a1815" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">person_id →</text><text x="266" y="236" fill="#1a1815" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">type · source</text><text x="266" y="256" fill="#1a1815" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">timestamp</text><text x="266" y="276" fill="#1a1815" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">ref_code</text><path fill="#ece6da" stroke="#6a6355" d="M460 110h200v260H460z"/><text x="476" y="138" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">attribution</text><text x="476" y="158" fill="#8a8072" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11">one row per credit</text><path stroke="#d9d0bd" d="M476 172h168"/><text x="476" y="196" fill="#1a1815" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">event_id →</text><text x="476" y="216" fill="#1a1815" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">partner_id</text><text x="476" y="236" fill="#1a1815" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">model</text><text x="476" y="256" fill="#1a1815" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">weight</text><path fill="#ece6da" stroke="#6a6355" d="M670 110h200v260H670z"/><text x="686" y="138" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">outcomes</text><text x="686" y="158" fill="#8a8072" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11">one row per result</text><path stroke="#d9d0bd" d="M686 172h168"/><text x="686" y="196" fill="#1a1815" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">outcome_id</text><text x="686" y="216" fill="#1a1815" font-family="'Space Grotesk', ui-monospace, monos