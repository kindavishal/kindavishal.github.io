<svg xmlns="http://www.w3.org/2000/svg" aria-label="Three-step timeline showing attribution instrumentation must happen at T=0; by the time budget pressure arrives there's no retroactive fix." style="display:block;width:100%;height:auto;background:#f4efe6;border:1px solid #d9d0bd;border-radius:8px" viewBox="0 0 900 440"><text x="40" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" letter-spacing="1.5">THE ORDER MATTERS</text><text x="40" y="80" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="22">Attribution cannot be applied backwards.</text><text x="860" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.5" text-anchor="end">MID-POST</text><path stroke="#d9d0bd" stroke-width="2" d="M60 120v280"/><circle cx="60" cy="140" r="8" fill="#6a6355"/><text x="90" y="140" fill="#6a6355" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">T · 0 · SHOULD HAVE HAPPENED</text><text x="90" y="168" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="17">Instrument every link, form, registration.</text><text x="90" y="190" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="17">Store one row per event.</text><text x="90" y="212" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">Costs an afternoon. Cheapest step in the whole programme.</text><path fill="#b8532e" d="M60 248.686 71.314 260 60 271.314 48.686 260z"/><text x="90" y="260" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">T · +N MONTHS · BUDGET CONVERSATION TURNS</text><text x="90" y="288" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="17">Someone is deciding whether the programme continues.</text><circle cx="60" cy="340" r="8" fill="none" stroke="#b8532e" stroke-width="2"/><text x="90" y="340" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">T · +N + 1 · METRIC PRESSURE ARRIVES</text><text x="90" y="368" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="17">Asked to prove what you can no longer prove.</text><text x="90" y="390" fill="#b8532e" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">The events you didn&apos;t log are gone. There is no retroactive fix.</text></svg>