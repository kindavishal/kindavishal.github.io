<svg xmlns="http://www.w3.org/2000/svg" aria-label="A viral clip spikes and decays; a tutorial's value rises steadily over 12 months." style="display:block;width:100%;height:auto;background:#f4efe6;border:1px solid #d9d0bd;border-radius:8px" viewBox="0 0 900 380"><text x="40" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" letter-spacing="1.5">THE ASSET WITH A LONG LIFE</text><text x="40" y="80" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="22">A tutorial keeps working after the algorithm forgets it.</text><text x="860" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.5" text-anchor="end">MID-POST</text><path stroke="#d9d0bd" d="M60 130v200m0 0h800"/><path fill="none" stroke="#6a6355" stroke-width="2" d="m60 320 68-145 69 22 91 73 115 30 114 15 114 5 115 2 114 1"/><path fill="none" stroke="#b8532e" stroke-width="2.5" d="m60 320 68-15 69-10 91-15 115-20 114-20 114-25 115-25 114-20"/><text x="854" y="144" fill="#6a6355" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" text-anchor="end">viral clip (pay-per-view)</text><text x="854" y="162" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" text-anchor="end">tutorial (pay-per-video)</text><text x="56" y="144" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10">VALUE →</text><g fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10"><text x="60" y="352">week 0</text><text x="172" y="352" text-anchor="middle">1</text><text x="284" y="352" text-anchor="middle">2</text><text x="404" y="352" text-anchor="middle">1 mo</text><text x="516" y="352" text-anchor="middle">3 mo</text><text x="628" y="352" text-anchor="middle">6 mo</text><text x="860" y="352" text-anchor="end">12 mo</text></g><text x="40" y="364" fill="#6a6355" font-family="'Literata', Georgia, serif" font-size="13" font-style="italic">Views peak and decay. A useful tutorial gets found by the next developer — and by the model trying to answer them.</text></svg>