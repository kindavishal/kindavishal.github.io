<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="The four-rung measurement ladder for share-of-model: named at all, named first, described accurately, who you appear beside." style="display:block;width:100%;height:auto;background:#F4EFE6;border:1px solid #D9D0BD;border-radius:8px">

<text x="40" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#8A8072" letter-spacing="1.5">WHAT TO WATCH — IN ORDER</text>
<text x="40" y="80" font-family="'Literata', Georgia, serif" font-size="22" fill="#1A1815">Four rungs, cheapest to run first.</text>
<text x="860" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="end" letter-spacing="1.5">MID-POST</text>
<line x1="40" y1="115" x2="860" y2="115" stroke="#D9D0BD"/><text x="60" y="149" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#B8532E">01</text><text x="140" y="149" font-family="'Literata', Georgia, serif" font-size="16" fill="#1A1815">Named at all</text><text x="460" y="149" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">The only binary that matters. Track it first.</text><line x1="40" y1="171" x2="860" y2="171" stroke="#D9D0BD"/><text x="60" y="205" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#B8532E">02</text><text x="140" y="205" font-family="'Literata', Georgia, serif" font-size="16" fill="#1A1815">Named first</text><text x="460" y="205" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">Position within the answer, where an answer gives one.</text><line x1="40" y1="227" x2="860" y2="227" stroke="#D9D0BD"/><text x="60" y="261" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#B8532E">03</text><text x="140" y="261" font-family="'Literata', Georgia, serif" font-size="16" fill="#1A1815">Described accurately</text><text x="460" y="261" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">Being named for the wrong job is its own problem.</text><line x1="40" y1="283" x2="860" y2="283" stroke="#D9D0BD"/><rect x="40" y="283" width="820" height="56" fill="#B8532E" fill-opacity="0.06"/><text x="60" y="317" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#B8532E">04 ★</text><text x="140" y="317" font-family="'Literata', Georgia, serif" font-size="16" fill="#1A1815">Who you appear beside</text><text x="460" y="317" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">Your competitive set as the model understands it. Cheaper than any survey.</text><line x1="40" y1="339" x2="860" y2="339" stroke="#D9D0BD"/>
<text x="40" y="369" font-family="'Literata', Georgia, serif" font-style="italic" font-size="13" fill="#6A6355">Fixed prompts. Weekly cadence. One row per run. Never summarise at write time.</text>

</svg>