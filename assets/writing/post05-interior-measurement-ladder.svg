<svg xmlns="http://www.w3.org/2000/svg" aria-label="The four-rung measurement ladder for share-of-model: named at all, named first, described accurately, who you appear beside." style="display:block;width:100%;height:auto;background:#f4efe6;border:1px solid #d9d0bd;border-radius:8px" viewBox="0 0 900 400"><text x="40" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" letter-spacing="1.5">WHAT TO WATCH — IN ORDER</text><text x="40" y="80" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="22">Four rungs, cheapest to run first.</text><text x="860" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.5" text-anchor="end">MID-POST</text><path stroke="#d9d0bd" d="M40 115h820"/><text x="60" y="149" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11">01</text><text x="140" y="149" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="16">Named at all</text><text x="460" y="149" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">The only binary that matters. Track it first.</text><path stroke="#d9d0bd" d="M40 171h820"/><text x="60" y="205" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11">02</text><text x="140" y="205" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="16">Named first</text><text x="460" y="205" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">Position within the answer, where an answer gives one.</text><path stroke="#d9d0bd" d="M40 227h820"/><text x="60" y="261" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11">03</text><text x="140" y="261" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="16">Described accurately</text><text x="460" y="261" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">Being named for the wrong job is its own problem.</text><path stroke="#d9d0bd" d="M40 283h820"/><path fill="#b8532e" fill-opacity=".06" d="M40 283h820v56H40z"/><text x="60" y="317" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11">04 ★</text><text x="140" y="317" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="16">Who you appear beside</text><text x="460" y="317" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">Your competitive set as the model understands it. Cheaper than any survey.</text><path stroke="#d9d0bd" d="M40 339h820"/><text x="40" y="369" fill="#6a6355" font-family="'Literata', Georgia, serif" font-size="13" font-style="italic">Fixed prompts. Weekly cadence. One row per run. Never summarise at write time.</text></svg>