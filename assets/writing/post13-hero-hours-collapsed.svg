<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="40 hours per week collapsed to 5 hours of judgment; the deeper cost was partners not signed, problems found a month late, and no current picture ever." style="display:block;width:100%;height:auto;background:#F4EFE6;border:1px solid #D9D0BD;border-radius:8px">

<text x="40" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#8A8072" letter-spacing="1.5">300-PARTNER PROGRAM · A WORKING WEEK PER WEEK</text>
<text x="40" y="80" font-family="'Literata', Georgia, serif" font-size="22" fill="#1A1815">The hours are the number on the card. Not the interesting part.</text>
<text x="860" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="end" letter-spacing="1.5">HERO</text>

<!-- BEFORE bar -->
<text x="40" y="145" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#6A6355">BEFORE</text>
<rect x="150" y="128" width="700" height="28" fill="#6A6355"/>
<text x="164" y="147" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#F4EFE6">40 hrs / week</text>

<!-- AFTER bar (12% width) -->
<text x="40" y="200" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#B8532E">AFTER</text>
<rect x="150" y="183" width="84" height="28" fill="#B8532E"/>
<text x="160" y="202" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#F4EFE6">~5 hrs</text>
<text x="248" y="202" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#B8532E">judgment only</text>

<line x1="40" y1="245" x2="860" y2="245" stroke="#D9D0BD"/>
<text x="40" y="275" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#6A6355" letter-spacing="1.2">WHAT THE BUSYWORK ACTUALLY COST</text>

<!-- three cards -->
<g transform="translate(40 300)">
  <rect x="0" y="0" width="3" height="70" fill="#B8532E"/>
  <text x="14" y="22" font-family="'Literata', Georgia, serif" font-size="15" fill="#B8532E">Partners not signed</text>
  <text x="14" y="46" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">Onboarding couldn't</text>
  <text x="14" y="64" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">keep up.</text>
</g>
<g transform="translate(320 300)">
  <rect x="0" y="0" width="3" height="70" fill="#B8532E"/>
  <text x="14" y="22" font-family="'Literata', Georgia, serif" font-size="15" fill="#B8532E">Problems found a month late</text>
  <text x="14" y="46" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">Reports were monthly,</text>
  <text x="14" y="64" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">not weekly.</text>
</g>
<g transform="translate(620 300)">
  <rect x="0" y="0" width="3" height="70" fill="#B8532E"/>
  <text x="14" y="22" font-family="'Literata', Georgia, serif" font-size="15" fill="#B8532E">No current picture, ever</text>
  <text x="14" y="46" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">Four people had to be</text>
  <text x="14" y="64" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">asked.</text>
</g>

<text x="40" y="415" font-family="'Literata', Georgia, serif" font-style="italic" font-size="13" fill="#6A6355">Hours saved is the shallow read. The ceiling was the real cost.</text>

</svg>