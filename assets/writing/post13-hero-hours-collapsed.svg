<svg xmlns="http://www.w3.org/2000/svg" aria-label="40 hours per week collapsed to 5 hours of judgment; the deeper cost was partners not signed, problems found a month late, and no current picture ever." style="display:block;width:100%;height:auto;background:#f4efe6;border:1px solid #d9d0bd;border-radius:8px" viewBox="0 0 900 460"><text x="40" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" letter-spacing="1.5">300-PARTNER PROGRAM · A WORKING WEEK PER WEEK</text><text x="40" y="80" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="22">The hours are the number on the card. Not the interesting part.</text><text x="860" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.5" text-anchor="end">HERO</text><text x="40" y="145" fill="#6a6355" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11">BEFORE</text><path fill="#6a6355" d="M150 128h700v28H150z"/><text x="164" y="147" fill="#f4efe6" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">40 hrs / week</text><text x="40" y="200" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11">AFTER</text><path fill="#b8532e" d="M150 183h84v28h-84z"/><text x="160" y="202" fill="#f4efe6" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12">~5 hrs</text><text x="248" y="202" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11">judgment only</text><path stroke="#d9d0bd" d="M40 245h820"/><text x="40" y="275" fill="#6a6355" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">WHAT THE BUSYWORK ACTUALLY COST</text><path fill="#b8532e" d="M40 300h3v70h-3z"/><text x="14" y="22" fill="#b8532e" font-family="'Literata', Georgia, serif" font-size="15" transform="translate(40 300)">Partners not signed</text><text x="14" y="46" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(40 300)">Onboarding couldn&apos;t</text><text x="14" y="64" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(40 300)">keep up.</text><path fill="#b8532e" d="M320 300h3v70h-3z"/><text x="14" y="22" fill="#b8532e" font-family="'Literata', Georgia, serif" font-size="15" transform="translate(320 300)">Problems found a month late</text><text x="14" y="46" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(320 300)">Reports were monthly,</text><text x="14" y="64" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(320 300)">not weekly.</text><path fill="#b8532e" d="M620 300h3v70h-3z"/><text x="14" y="22" fill="#b8532e" font-family="'Literata', Georgia, serif" font-size="15" transform="translate(620 300)">No current picture, ever</text><text x="14" y="46" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(620 300)">Four people had to be</text><text x="14" y="64" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(620 300)">asked.</text><text x="40" y="415" fill="#6a6355" font-family="'Literata', Georgia, serif" font-size="13" font-style="italic">Hours saved is the shallow read. The ceiling was the real cost.</text></svg>