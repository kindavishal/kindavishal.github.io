<svg xmlns="http://www.w3.org/2000/svg" aria-label="Two thresholds break comparison; one threshold makes sources comparable" style="display:block;width:100%;height:auto;background:#f4efe6;border:1px solid #d9d0bd;border-radius:8px" viewBox="0 0 900 380"><text x="40" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" letter-spacing="1.5">THE TRICK THAT MAKES IT WORK</text><text x="40" y="80" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="22">One threshold, or the sources stop being comparable.</text><text x="860" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.5" text-anchor="end">MID-POST</text><path fill="none" stroke="#d9d0bd" d="M40 110h390v220H40z"/><text x="20" y="30" fill="#6a6355" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2" transform="translate(40 110)">TWO THRESHOLDS</text><text x="150" y="30" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" transform="translate(40 110)">✗</text><text x="20" y="70" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(40 110)">LinkedIn</text><path fill="#8a8072" d="M150 170h200v8H150z"/><text x="320" y="70" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" transform="translate(40 110)">newsletter signup</text><text x="20" y="100" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(40 110)">Conf talk</text><path fill="#b8532e" d="M150 200h200v8H150z"/><text x="320" y="100" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" transform="translate(40 110)">call booking</text><path stroke="#d9d0bd" stroke-dasharray="3 3" d="M60 260h350"/><text x="20" y="175" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(40 110)">Two different amounts of intent. You will</text><text x="20" y="193" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(40 110)">guess which is better — and you&apos;ll guess</text><text x="20" y="211" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(40 110)">in favour of the bigger number.</text><path fill="#b8532e" fill-opacity=".06" stroke="#d9d0bd" d="M470 110h390v220H470z"/><text x="20" y="30" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2" transform="translate(470 110)">ONE THRESHOLD</text><text x="150" y="30" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" transform="translate(470 110)">✓</text><text x="20" y="66" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(470 110)">LinkedIn</text><path fill="#b8532e" d="M580 168h200v8H580z"/><text x="320" y="66" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" transform="translate(470 110)">call booking</text><text x="20" y="92" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(470 110)">Conf talk</text><path fill="#b8532e" d="M580 194h200v8H580z"/><text x="320" y="92" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" transform="translate(470 110)">call booking</text><text x="20" y="118" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(470 110)">Newsletter</text><path fill="#b8532e" d="M580 220h200v8H580z"/><text x="320" y="118" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" transform="translate(470 110)">call booking</text><text x="20" y="144" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(470 110)">Partner</text><path fill="#b8532e" d="M580 246h200v8H580z"/><text x="320" y="144" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" transform="translate(470 110)">call booking</text><path stroke="#d9d0bd" stroke-dasharray="3 3" d="M490 280h350"/><text x="20" y="192" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(470 110)">Every source funnels to the same action.</text><text x="20" y="210" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(470 110)">The numbers mean the same thing.</text></svg>