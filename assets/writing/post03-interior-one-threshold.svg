<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Two thresholds break comparison; one threshold makes sources comparable" style="display:block;width:100%;height:auto;background:#F4EFE6;border:1px solid #D9D0BD;border-radius:8px">

<text x="40" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#8A8072" letter-spacing="1.5">THE TRICK THAT MAKES IT WORK</text>
<text x="40" y="80" font-family="'Literata', Georgia, serif" font-size="22" fill="#1A1815">One threshold, or the sources stop being comparable.</text>
<text x="860" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="end" letter-spacing="1.5">MID-POST</text>

<!-- WRONG panel -->
<g transform="translate(40 110)">
  <rect width="390" height="220" fill="none" stroke="#D9D0BD"/>
  <text x="20" y="30" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#6A6355" letter-spacing="1.2">TWO THRESHOLDS</text>
  <text x="150" y="30" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#B8532E">✗</text>

  <text x="20" y="70" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">LinkedIn</text>
  <rect x="110" y="60" width="200" height="8" fill="#8A8072"/>
  <text x="320" y="70" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072">newsletter signup</text>

  <text x="20" y="100" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">Conf talk</text>
  <rect x="110" y="90" width="200" height="8" fill="#B8532E"/>
  <text x="320" y="100" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072">call booking</text>

  <line x1="20" y1="150" x2="370" y2="150" stroke="#D9D0BD" stroke-dasharray="3 3"/>
  <text x="20" y="175" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">Two different amounts of intent. You will</text>
  <text x="20" y="193" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">guess which is better — and you'll guess</text>
  <text x="20" y="211" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">in favour of the bigger number.</text>
</g>

<!-- RIGHT panel -->
<g transform="translate(470 110)">
  <rect width="390" height="220" fill="#B8532E" fill-opacity="0.06" stroke="#D9D0BD"/>
  <text x="20" y="30" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#B8532E" letter-spacing="1.2">ONE THRESHOLD</text>
  <text x="150" y="30" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#B8532E">✓</text>

  <text x="20" y="66" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">LinkedIn</text>
  <rect x="110" y="58" width="200" height="8" fill="#B8532E"/>
  <text x="320" y="66" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#B8532E">call booking</text>

  <text x="20" y="92" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">Conf talk</text>
  <rect x="110" y="84" width="200" height="8" fill="#B8532E"/>
  <text x="320" y="92" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#B8532E">call booking</text>

  <text x="20" y="118" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">Newsletter</text>
  <rect x="110" y="110" width="200" height="8" fill="#B8532E"/>
  <text x="320" y="118" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#B8532E">call booking</text>

  <text x="20" y="144" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">Partner</text>
  <rect x="110" y="136" width="200" height="8" fill="#B8532E"/>
  <text x="320" y="144" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#B8532E">call booking</text>

  <line x1="20" y1="170" x2="370" y2="170" stroke="#D9D0BD" stroke-dasharray="3 3"/>
  <text x="20" y="192" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">Every source funnels to the same action.</text>
  <text x="20" y="210" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">The numbers mean the same thing.</text>
</g>

</svg>