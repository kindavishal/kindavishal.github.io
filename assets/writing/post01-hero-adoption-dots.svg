  <text x="220" y="0" font-family="'Literata', Georgia, serif" font-size="18" fill="#1A1815">15.7%</text>
  <text x="272" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">tried it, free</text>
  <rect x="410" y="-10" width="12" height="12" fill="#B8532E"/>
  <text x="430" y="0" font-family="'Literata', Georgia, serif" font-size="18" fill="#B8532E">0.3%</text>
  <text x="472" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">paying subscriber</text>
