<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Global AI adoption Feb 2026: 84% never used AI, 15.7% tried it, 0.3% pay — one dot approximately equals five people." style="display:block;width:100%;height:auto;background:#F4EFE6;border:1px solid #D9D0BD;border-radius:8px">

<text x="40" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#8A8072" letter-spacing="1.5">GLOBAL AI ADOPTION · FEB 2026</text>
<text x="40" y="80" font-family="'Literata', Georgia, serif" font-size="26" fill="#1A1815">One dot ≈ five people. Ten thousand people.</text>
<text x="860" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="end" letter-spacing="1.5">HERO</text>
<defs>
<pattern id="dgN" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#D9D0BD"/></pattern>
<pattern id="dgM" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#6A6355"/></pattern>
<pattern id="dgA" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#B8532E"/></pattern>
</defs>
<rect x="51" y="120" width="798" height="158" fill="url(#dgN)"/>
<rect x="691" y="248" width="158" height="6" fill="url(#dgM)"/>
<rect x="51" y="256" width="798" height="22" fill="url(#dgM)"/>
<rect x="803" y="272" width="46" height="6" fill="url(#dgA)"/>
<g transform="translate(40 318)">
  <rect x="0" y="-10" width="12" height="12" fill="#D9D0BD"/>
  <text x="20" y="0" font-family="'Literata', Georgia, serif" font-size="18" fill="#1A1815">84%</text>
  <text x="62" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">never used AI</text>
