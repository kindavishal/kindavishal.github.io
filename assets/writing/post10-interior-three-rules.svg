<svg xmlns="http://www.w3.org/2000/svg" aria-label="Three rules for a humane streak system: rolling window, banked extra work, and one-click pause signal." style="display:block;width:100%;height:auto;background:#f4efe6;border:1px solid #d9d0bd;border-radius:8px" viewBox="0 0 900 360"><text x="40" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" letter-spacing="1.5">THREE RULES · ONE CALENDAR</text><text x="40" y="80" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="22">Cadence without a penalty for being human.</text><text x="860" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.5" text-anchor="end">MID-POST</text><path fill="none" stroke="#d9d0bd" d="M40 110h260v190H40z"/><text x="56" y="134" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">01 · WINDOW</text><text x="56" y="164" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="15">Streak measured on a</text><text x="56" y="186" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="15">rolling window</text><text x="56" y="222" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">Any 4-of-6 weeks counts. One</text><text x="56" y="239" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">missed week doesn&apos;t wipe the</text><text x="56" y="256" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">past three.</text><path fill="none" stroke="#d9d0bd" d="M320 110h260v190H320z"/><text x="336" y="134" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">02 · BANKED</text><text x="336" y="164" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="15">Extra work banks toward</text><text x="336" y="186" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="15">future weeks</text><text x="336" y="222" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">Ship two in one week? The</text><text x="336" y="239" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">second covers next week if</text><text x="336" y="256" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">you need it.</text><path fill="#b8532e" fill-opacity=".06" stroke="#d9d0bd" d="M600 110h260v190H600z"/><text x="616" y="134" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">03 · SIGNAL</text><text x="616" y="164" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="15">Flag ahead of time is a</text><text x="616" y="186" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="15">supported action</text><text x="616" y="222" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">Vacation, illness, deadline</text><text x="616" y="239" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">elsewhere — a one-click</text><text x="616" y="256" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">pause.</text><text x="40" y="335" fill="#6a6355" font-family="'Literata', Georgia, serif" font-size="13" font-style="italic">A creator punished for being ill will quietly leave. A creator whose streak survives will still be there next quarter.</text></svg>