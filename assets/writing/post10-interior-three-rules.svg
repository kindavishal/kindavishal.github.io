<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Three rules for a humane streak system: rolling window, banked extra work, and one-click pause signal." style="display:block;width:100%;height:auto;background:#F4EFE6;border:1px solid #D9D0BD;border-radius:8px">

<text x="40" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#8A8072" letter-spacing="1.5">THREE RULES · ONE CALENDAR</text>
<text x="40" y="80" font-family="'Literata', Georgia, serif" font-size="22" fill="#1A1815">Cadence without a penalty for being human.</text>
<text x="860" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="end" letter-spacing="1.5">MID-POST</text>
<rect x="40" y="110" width="260" height="190" fill="none" fill-opacity="1" stroke="#D9D0BD"/><text x="56" y="134" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#B8532E" letter-spacing="1.2">01 · WINDOW</text><text x="56" y="164" font-family="'Literata', Georgia, serif" font-size="15" fill="#1A1815">Streak measured on a</text><text x="56" y="186" font-family="'Literata', Georgia, serif" font-size="15" fill="#1A1815">rolling window</text><text x="56" y="222" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">Any 4-of-6 weeks counts. One</text><text x="56" y="239" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">missed week doesn't wipe the</text><text x="56" y="256" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">past three.</text><rect x="320" y="110" width="260" height="190" fill="none" fill-opacity="1" stroke="#D9D0BD"/><text x="336" y="134" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#B8532E" letter-spacing="1.2">02 · BANKED</text><text x="336" y="164" font-family="'Literata', Georgia, serif" font-size="15" fill="#1A1815">Extra work banks toward</text><text x="336" y="186" font-family="'Literata', Georgia, serif" font-size="15" fill="#1A1815">future weeks</text><text x="336" y="222" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">Ship two in one week? The</text><text x="336" y="239" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">second covers next week if</text><text x="336" y="256" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">you need it.</text><rect x="600" y="110" width="260" height="190" fill="#B8532E" fill-opacity="0.06" stroke="#D9D0BD"/><text x="616" y="134" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#B8532E" letter-spacing="1.2">03 · SIGNAL</text><text x="616" y="164" font-family="'Literata', Georgia, serif" font-size="15" fill="#1A1815">Flag ahead of time is a</text><text x="616" y="186" font-family="'Literata', Georgia, serif" font-size="15" fill="#1A1815">supported action</text><text x="616" y="222" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">Vacation, illness, deadline</text><text x="616" y="239" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">elsewhere — a one-click</text><text x="616" y="256" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">pause.</text>
<text x="40" y="335" font-family="'Literata', Georgia, serif" font-style="italic" font-size="13" fill="#6A6355">A creator punished for being ill will quietly leave. A creator whose streak survives will still be there next quarter.</text>

</svg>