<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="Five-tier ambassador program keyed to rolling 3-month average views: T5 Marquee (≥100K) down to T1 Entry (&lt;3K)." style="display:block;width:100%;height:auto;background:#F4EFE6;border:1px solid #D9D0BD;border-radius:8px">

<text x="40" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#8A8072" letter-spacing="1.5">ONE METRIC · ROLLING 3-MONTH AVG VIEWS</text>
<text x="40" y="80" font-family="'Literata', Georgia, serif" font-size="22" fill="#1A1815">Tier measures reach. Nothing else.</text>
<text x="860" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="end" letter-spacing="1.5">HERO</text>
