"/><rect x="40" y="336" width="5" height="44" fill="#6A6355"/><text x="70" y="364" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#B8532E">T1</text><text x="130" y="364" font-family="'Literata', Georgia, serif" font-size="17" fill="#1A1815">Entry</text><text x="844" y="364" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#6A6355" text-anchor="end">&lt; 3K</text>
