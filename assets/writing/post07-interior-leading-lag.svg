<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Tutorials shipped (leading) plotted against activations (lagging), with a roughly three-week lag between them." style="display:block;width:100%;height:auto;background:#F4EFE6;border:1px solid #D9D0BD;border-radius:8px">

<text x="40" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#8A8072" letter-spacing="1.5">LEADING INDICATOR · MEASURABLE LAG</text>
<text x="40" y="80" font-family="'Literata', Georgia, serif" font-size="22" fill="#1A1815">A team that forecasts is an input to planning.</text>
<text x="860" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="end" letter-spacing="1.5">MID-POST</text>

<line x1="60" y1="130" x2="60" y2="330" stroke="#D9D0BD"/>
<line x1="60" y1="330" x2="860" y2="330" stroke="#D9D0BD"/>

<!-- tutorials shipped (leading, muted) -->
<polyline points="60,310 174.0,270.0 288.0,220.0 402.0,200.0 516.0,190.0 630.0,185.0 744.0,182.0 860,180.0" fill="none" stroke="#6A6355" stroke-width="2"/>
<!-- activations (lagging, accent) -->
<polyline points="60,310 174.0,305.0 288.0,298.0 402.0,285.0 516.0,250.0 630.0,210.0 744.0,185.0 860,175.0" fill="none" stroke="#B8532E" stroke-width="2.5"/>

<!-- lag markers -->
<line x1="402.0" y1="200.0" x2="402.0" y2="330" stroke="#6A6355" stroke-dasharray="3 3"/>
<line x1="630.0" y1="210.0" x2="630.0" y2="330" stroke="#B8532E" stroke-dasharray="3 3"/>

<rect x="440" y="216.0" width="110" height="22" fill="#F4EFE6" stroke="#B8532E"/>
<text x="495" y="232.0" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#B8532E" text-anchor="middle">~3-week lag</text>

<text x="854" y="144" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#6A6355" text-anchor="end">tutorials shipped</text>
<text x="854" y="162" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#B8532E" text-anchor="end">activations</text>

<text x="60" y="352" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072">w0</text>
<text x="220.0" y="352" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="middle">w2</text>
<text x="380.0" y="352" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="middle">w4</text>
<text x="540.0" y="352" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="middle">w6</text>
<text x="700.0" y="352" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="middle">w8</text>
<text x="860" y="352" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="end">w10</text>

<text x="40" y="360" font-family="'Literata', Georgia, serif" font-style="italic" font-size="13" fill="#6A6355">Under a measurable lag, the argument is about the lag — which you can win.</text>

</svg>