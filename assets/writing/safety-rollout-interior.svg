  <text x="384" y="228" font-family="Space Grotesk, system-ui, sans-serif" font-size="11" font-weight="500" fill="#1C1917" text-anchor="middle">runbook v1</text>

  <circle cx="536" cy="180" r="6" fill="#D97706"></circle>
  <line x1="536" y1="186" x2="536" y2="210" stroke="#1C1917" stroke-width="1"></line>
  <text x="536" y="160" font-family="Space Grotesk, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1917" text-anchor="middle">T-0</text>
  <text x="536" y="228" font-family="Space Grotesk, system-ui, sans-serif" font-size="11" font-weight="500" fill="#1C1917" text-anchor="middle">launch</text>

  <circle cx="688" cy="180" r="6" fill="#1C1917"></circle>
  <line x1="688" y1="186" x2="688" y2="210" stroke="#1C1917" stroke-width="1"></line>
  <text x="688" y="160" font-family="Space Grotesk, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1917" text-anchor="middle">T+7</text>
  <text x="688" y="228" font-family="Space Grotesk, system-ui, sans-serif" font-size="11" font-weight="500" fill="#1C1917" text-anchor="middle">first check-in</text>

  <circle cx="840" cy="180" r="6" fill="#1C1917"></circle>
  <line x1="840" y1="186" x2="840" y2="210" stroke="#1C1917" stroke-width="1"></line>
  <text x="840" y="160" font-family="Space Grotesk, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1917" text-anchor="middle">T+30</text>
  <text x="840" y="228" font-family="Space Grotesk, system-ui, sans-serif" font-size="11" font-weight="500" fill="#1C1917" text-anchor="middle">review</text>



<text x="80" y="290" font-family="Space Grotesk, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1917">Tier progress</text>

<g>


    <text x="80" y="328" font-family="Space Grotesk, system-ui, sans-serif" font-size="11" font-weight="500" fill="#1C1917">Tier 1</text>
    <rect x="140" y="310" width="700" height="24" fill="#F8F6F2" stroke="#1C1917" stroke-width="0.8"></rect>
    <rect x="140" y="310" width="720" height="24" fill="#FEF3C7" opacity="1"></rect>
    <text x="868" y="327" font-family="Space Grotesk, system-ui, sans-serif" font-size="10" font-weight="600" fill="#1C1917">100%</text>

    <text x="80" y="366" font-family="Space Grotesk, system-ui, sans-serif" font-size="11" font-weight="500" fill="#1C1917">Tier 2</text>
    <rect x="140" y="348" width="700" height="24" fill="#F8F6F2" stroke="#1C1917" stroke-width="0.8"></rect>
    <rect x="140" y="348" width="620" height="24" fill="#1C1917" opacity="1"></rect>
    <text x="768" y="365" font-family="Space Grotesk, system-ui, sans-serif" font-size="10" font-weight="600" fill="#1C1917">86%</text>

    <text x="80" y="404" font-family="Space Grotesk, system-ui, sans-serif" font-size="11" font-weight="500" fill="#1C1917">Tier 3</text>
    <rect x="140" y="386" width="700" height="24" fill="#F8F6F2" stroke="#1C1917" stroke-width="0.8"></rect>
    <rect x="140" y="386" width="500" height="24" fill="#D97706" opacity="1"></rect>
    <text x="648" y="403" font-family="Space Grotesk, system-ui, sans-serif" font-size="10" font-weight="600" fill="#1C1917">71%</text>

</g>

<text x="60" y="450" font-family="Literata, Georgia, serif" font-style="italic" font-size="13" fill="#1C1917" opacity="0.8">the slower tiers catch up — they don't fall behind</text>

</svg>