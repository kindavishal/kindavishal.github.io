<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img">
<rect width="900" height="500" fill="#F8F6F2"></rect>

<text x="60" y="70" font-family="Space Grotesk, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1C1917">Rollout timeline</text>

<line x1="80" y1="180" x2="840" y2="180" stroke="#1C1917" stroke-width="1.5"></line>

  <circle cx="80" cy="180" r="6" fill="#1C1917"></circle>
  <line x1="80" y1="186" x2="80" y2="210" stroke="#1C1917" stroke-width="1"></line>
  <text x="80" y="160" font-family="Space Grotesk, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1917" text-anchor="middle">T-30</text>
  <text x="80" y="228" font-family="Space Grotesk, system-ui, sans-serif" font-size="11" font-weight="500" fill="#1C1917" text-anchor="middle">draft policy</text>

  <circle cx="232" cy="180" r="6" fill="#1C1917"></circle>
  <line x1="232" y1="186" x2="232" y2="210" stroke="#1C1917" stroke-width="1"></line>
  <text x="232" y="160" font-family="Space Grotesk, system-ui, sans-serif" font-size="13" font-weight="600" fill="#1C1917" text-anchor="middle">T-14</text>
  <text x="232" y="228" font-family="Space Grotesk, system-ui, sans-serif" font-size="11" font-weight="500" fill="#1C1917" text-anchor="middle">pilot begins</text>

  <circle cx="384" cy="180" r="6" fill="#1C1917"></circle>
