<svg xmlns="http://www.w3.org/2000/svg" aria-label="Three-column table: what was manual, what became a script, and what stayed human — the judgment calls that shouldn't be automated." style="display:block;width:100%;height:auto;background:#f4efe6;border:1px solid #d9d0bd;border-radius:8px" viewBox="0 0 900 500"><text x="40" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" letter-spacing="1.5">AUTOMATE THE HANDOFFS · NEVER THE JUDGMENT</text><text x="40" y="80" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="22">The line you must not cross.</text><text x="860" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.5" text-anchor="end">MID-POST</text><text x="40" y="130" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">WHAT WAS MANUAL</text><text x="330" y="130" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">→ SCRIPT</text><text x="600" y="130" fill="#6a6355" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">STAYED HUMAN</text><path stroke="#cfc6b5" d="M40 140h820"/><text x="40" y="172" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">Copy application into tracker</text><text x="330" y="172" fill="#b8532e" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">form-submit writes the row</text><text x="600" y="172" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">whether partner qualifies</text><path stroke="#d9d0bd" d="M40 188h820"/><text x="40" y="224" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">Chase missing documents</text><text x="330" y="224" fill="#b8532e" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">scheduled reminder</text><text x="600" y="224" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">whether to grant exception</text><path stroke="#d9d0bd" d="M40 240h820"/><text x="40" y="276" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">Assemble weekly report</text><text x="330" y="276" fill="#b8532e" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">scheduled table build</text><text x="600" y="276" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">what the numbers mean</text><path stroke="#d9d0bd" d="M40 292h820"/><text x="40" y="328" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">&quot;Where is my application?&quot;</text><text x="330" y="328" fill="#b8532e" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">self-serve dashboard</text><text x="600" y="328" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">the awkward conversations</text><path stroke="#d9d0bd" d="M40 344h820"/><text x="40" y="380" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">Tell people stage changed</text><text x="330" y="380" fill="#b8532e" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">triggered notification</text><text x="600" y="380" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13">deciding to change the stage</text><path stroke="#d9d0bd" d="M40 396h820"/><text x="40" y="462" fill="#6a6355" font-family="'Literata', Georgia, serif" font-size="13" font-style="italic">The middle column is a few dozen lines of Apps Script each. Not clever. That’s the point.</text></svg>