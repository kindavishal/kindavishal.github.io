<svg xmlns="http://www.w3.org/2000/svg" aria-label="Two 12-week streak lines. Duolingo-style resets to zero after a missed week; the new system credits the week and keeps growing." style="display:block;width:100%;height:auto;background:#f4efe6;border:1px solid #d9d0bd;border-radius:8px" viewBox="0 0 900 380"><text x="40" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" letter-spacing="1.5">MISS ONE WEEK · WHAT HAPPENS</text><text x="40" y="80" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="22">A streak that resets is a system that fires you for a bad week.</text><text x="860" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.5" text-anchor="end">HERO</text><text x="40" y="150" fill="#6a6355" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">DUOLINGO-STYLE</text><path fill="#6a6355" d="M180 172h50v8h-50zm58-8h50v16h-50zm58-8h50v24h-50zm58-8h50v32h-50zm58-8h50v40h-50zm58-8h50v48h-50z"/><path fill="#cfc6b5" d="M528 176h50v4h-50z"/><path fill="#6a6355" d="M586 172h50v8h-50zm58-8h50v16h-50zm58-8h50v24h-50zm58-8h50v32h-50zm58-8h50v40h-50z"/><text x="40" y="240" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">NEW SYSTEM</text><path fill="#6a6355" d="M180 297h50v8h-50zm58-8h50v16h-50zm58-8h50v24h-50zm58-8h50v32h-50zm58-8h50v40h-50zm58-8h50v48h-50z"/><path fill="#b8532e" d="M528 257h50v48h-50z"/><path fill="#6a6355" d="M586 249h50v56h-50zm58-8h50v64h-50zm58-8h50v72h-50zm58-8h50v80h-50zm58-8h50v88h-50z"/><g fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" text-anchor="middle"><text x="205" y="325">w1</text><text x="263" y="325">w2</text><text x="321" y="325">w3</text><text x="379" y="325">w4</text><text x="437" y="325">w5</text><text x="495" y="325">w6</text><text x="553" y="325">w7 ✗</text><text x="611" y="325">w8</text><text x="669" y="325">w9</text><text x="727" y="325">w10</text><text x="785" y="325">w11</text><text x="843" y="325">w12</text></g><path stroke="#d9d0bd" d="M40 345h820"/><g fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11"><path d="M40 360h10v10H40z"/><text x="16" transform="translate(40 370)">streak intact</text><path fill="#cfc6b5" d="M150 360h10v10h-10z"/><text x="126" transform="translate(40 370)">missed week</text><path fill="#b8532e" d="M260 360h10v10h-10z"/><text x="236" transform="translate(40 370)">credited / preserved</text></g><text x="860" y="370" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="12" font-style="italic" text-anchor="end">the classic reset punishes vacations, illness, and family</text></svg>