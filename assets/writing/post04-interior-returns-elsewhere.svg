<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Community actions get counted in other functions' numbers; 21 managers per VP in community means little to climb into." style="display:block;width:100%;height:auto;background:#F4EFE6;border:1px solid #D9D0BD;border-radius:8px">

<text x="40" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#8A8072" letter-spacing="1.5">WHERE THE RETURNS LAND</text>
<text x="40" y="80" font-family="'Literata', Georgia, serif" font-size="22" fill="#1A1815">Community's returns get counted by other functions.</text>
<text x="860" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="end" letter-spacing="1.5">MID-POST</text>

<!-- Community did -->
<g transform="translate(40 110)">
  <rect width="340" height="180" fill="none" stroke="#D9D0BD"/>
  <text x="16" y="26" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#B8532E" letter-spacing="1.2">COMMUNITY DID</text>
  <g font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#1A1815">
    <text x="16" y="56"><tspan fill="#B8532E">·</tspan> Member wrote a tutorial</text>
    <text x="16" y="82"><tspan fill="#B8532E">·</tspan> Ambassador filed a bug</text>
    <text x="16" y="108"><tspan fill="#B8532E">·</tspan> Answer kept a dev around</text>
    <text x="16" y="134"><tspan fill="#B8532E">·</tspan> Partner shipped an integration</text>
  </g>
</g>

<!-- Arrow -->
<text x="450" y="205" font-family="'Space Grotesk', ui-monospace, monospace" font-size="20" fill="#8A8072" text-anchor="middle">→</text>

<!-- Someone else's number -->
<g transform="translate(480 110)">
  <rect width="380" height="180" fill="#6A6355" fill-opacity="0.06" stroke="#D9D0BD"/>
  <text x="16" y="26" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#6A6355" letter-spacing="1.2">SOMEONE ELSE'S NUMBER</text>
  <g font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" fill="#1A1815">
    <text x="16" y="56"><tspan fill="#6A6355">→</tspan> Marketing · organic acquisition</text>
    <text x="16" y="82"><tspan fill="#6A6355">→</tspan> Engineering · product quality</text>
    <text x="16" y="108"><tspan fill="#6A6355">→</tspan> CS · retention</text>
    <text x="16" y="134"><tspan fill="#6A6355">→</tspan> BD · partnerships</text>
  </g>
</g>

<!-- Pyramid row -->
<line x1="40" y1="310" x2="860" y2="310" stroke="#D9D0BD"/>
<text x="40" y="345" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#6A6355" letter-spacing="1.2">PYRAMID</text>
<g transform="translate(130 337)"><rect x="0" y="0" width="10" height="10" fill="#8A8072"/><rect x="14" y="0" width="10" height="10" fill="#8A8072"/><rect x="28" y="0" width="10" height="10" fill="#8A8072"/><rect x="42" y="0" width="10" height="10" fill="#8A8072"/><rect x="56" y="0" width="10" height="10" fill="#8A8072"/><rect x="70" y="0" width="10" height="10" fill="#8A8072"/><rect x="84" y="0" width="10" height="10" fill="#8A8072"/><rect x="98" y="0" width="10" height="10" fill="#8A8072"/><rect x="112" y="0" width="10" height="10" fill="#8A8072"/><rect x="126" y="0" width="10" height="10" fill="#8A8072"/><rect x="140" y="0" width="10" height="10" fill="#8A8072"/><rect x="154" y="0" width="10" height="10" fill="#8A8072"/><rect x="168" y="0" width="10" height="10" fill="#8A8072"/><rect x="182" y="0" width="10" height="10" fill="#8A8072"/><rect x="196" y="0" width="10" height="10" fill="#8A8072"/><rect x="210" y="0" width="10" height="10" fill="#8A8072"/><rect x="224" y="0" width="10" height="10" fill="#8A8072"/><rect x="238" y="0" width="10" height="10" fill="#8A8072"/><rect x="252" y="0" width="10" height="10" fill="#8A8072"/><rect x="266" y="0" width="10" height="10" fill="#8A8072"/><rect x="280" y="0" width="10" height="10" fill="#8A8072"/></g>
<text x="435" y="345" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#6A6355">: 1</text>
<rect x="465" y="333" width="14" height="14" fill="#B8532E"/>
<text x="490" y="345" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">≈ 21 managers per VP in community. Very little to climb into.</text>

