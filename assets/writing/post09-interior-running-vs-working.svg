<svg xmlns="http://www.w3.org/2000/svg" aria-label="Two log panels: 'running' shows green healthy status; 'reality' shows the same 42 rows every day, caught during launch week." style="display:block;width:100%;height:auto;background:#f4efe6;border:1px solid #d9d0bd;border-radius:8px" viewBox="0 0 900 400"><text x="40" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" letter-spacing="1.5">THE TRAP</text><text x="40" y="80" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="22">Running is not working.</text><text x="860" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.5" text-anchor="end">MID-POST</text><g transform="translate(40 110)"><path fill="none" stroke="#d9d0bd" d="M0 0h400v260H0z"/><circle cx="20" cy="30" r="6" fill="#4a8c3a"/><text x="34" y="34" fill="#6a6355" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">STATUS · RUNNING</text><path fill="#ece6da" d="M16 52h368v130H16z"/><g fill="#1a1815" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12"><text x="28" y="76">[ 12:00 ] fetch OK · 200</text><text x="28" y="98">[ 12:00 ] parsed 42 rows</text><text x="28" y="120">[ 12:00 ] wrote to sheet</text><text x="28" y="150" fill="#4a8c3a">✓ pipeline healthy</text></g><text x="16" y="212" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">Looks finished. Passes every check</text><text x="16" y="230" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">you wrote.</text></g><g transform="translate(460 110)"><path fill="#b8532e" fill-opacity=".05" stroke="#d9d0bd" d="M0 0h400v260H0z"/><circle cx="20" cy="30" r="6" fill="#b8532e"/><text x="34" y="34" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">REALITY · NOT WORKING</text><path fill="#ece6da" d="M16 52h368v130H16z"/><g fill="#1a1815" font-family="'Space Grotesk', ui-monospace, monospace" font-size="12"><text x="28" y="76">same 42 rows, six days</text><text x="28" y="98">cursor never advanced</text><text x="28" y="120">data is stale</text><text x="28" y="150" fill="#b8532e">✗ caught during launch week</text></g><text x="16" y="212" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">You get told what you want to hear.</text><text x="16" y="230" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">Ask for the opposite case.</text></g></svg>