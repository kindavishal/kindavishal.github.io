<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Two log panels: 'running' shows green healthy status; 'reality' shows the same 42 rows every day, caught during launch week." style="display:block;width:100%;height:auto;background:#F4EFE6;border:1px solid #D9D0BD;border-radius:8px">

<text x="40" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#8A8072" letter-spacing="1.5">THE TRAP</text>
<text x="40" y="80" font-family="'Literata', Georgia, serif" font-size="22" fill="#1A1815">Running is not working.</text>
<text x="860" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="end" letter-spacing="1.5">MID-POST</text>

<!-- LEFT: Running -->
<g transform="translate(40 110)">
  <rect width="400" height="260" fill="none" stroke="#D9D0BD"/>
  <circle cx="20" cy="30" r="6" fill="#4A8C3A"/>
  <text x="34" y="34" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#6A6355" letter-spacing="1.2">STATUS · RUNNING</text>
  <rect x="16" y="52" width="368" height="130" fill="#ECE6DA"/>
  <g font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#1A1815">
    <text x="28" y="76">[ 12:00 ] fetch OK · 200</text>
    <text x="28" y="98">[ 12:00 ] parsed 42 rows</text>
    <text x="28" y="120">[ 12:00 ] wrote to sheet</text>
    <text x="28" y="150" fill="#4A8C3A">✓ pipeline healthy</text>
  </g>
  <text x="16" y="212" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">Looks finished. Passes every check</text>
  <text x="16" y="230" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">you wrote.</text>
</g>

<!-- RIGHT: Not working -->
<g transform="translate(460 110)">
  <rect width="400" height="260" fill="#B8532E" fill-opacity="0.05" stroke="#D9D0BD"/>
  <circle cx="20" cy="30" r="6" fill="#B8532E"/>
  <text x="34" y="34" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#B8532E" letter-spacing="1.2">REALITY · NOT WORKING</text>
  <rect x="16" y="52" width="368" height="130" fill="#ECE6DA"/>
  <g font-family="'Space Grotesk', ui-monospace, monospace" font-size="12" fill="#1A1815">
    <text x="28" y="76">same 42 rows, six days</text>
    <text x="28" y="98">cursor never advanced</text>
    <text x="28" y="120">data is stale</text>
    <text x="28" y="150" fill="#B8532E">✗ caught during launch week</text>
  </g>
  <text x="16" y="212" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">You get told what you want to hear.</text>
  <text x="16" y="230" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">Ask for the opposite case.</text>
</g>

</svg>