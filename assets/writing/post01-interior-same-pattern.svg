<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-label="Two operators, same pattern: Glean and Firecrawl" style="display:block;width:100%;height:auto;background:#F4EFE6;border:1px solid #D9D0BD;border-radius:8px">

<text x="40" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#8A8072" letter-spacing="1.5">TWO OPERATORS · DIFFERENT COMPANIES · DIFFERENT PROBLEMS</text>
<text x="40" y="80" font-family="'Literata', Georgia, serif" font-size="22" fill="#1A1815">When the same unusual thing happens twice, it's a pattern.</text>
<text x="860" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="end" letter-spacing="1.5">MID-POST</text>

<!-- Card A -->
<g transform="translate(40 110)">
  <rect width="380" height="170" fill="none" stroke="#D9D0BD"/>
  <text x="20" y="30" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#B8532E" letter-spacing="1.2">CASE A · GLEAN</text>
  <text x="20" y="60" font-family="'Literata', Georgia, serif" font-size="16" fill="#1A1815">Community manager,</text>
  <text x="20" y="82" font-family="'Literata', Georgia, serif" font-size="16" fill="#1A1815">no coding background</text>
  <text x="20" y="112" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">Redesigned an entire community experience —</text>
  <text x="20" y="128" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">work that used to need devs, designers, queues.</text>
  <text x="20" y="158" font-family="'Literata', Georgia, serif" font-size="20" fill="#B8532E">~2 weeks</text>
  <text x="130" y="158" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#B8532E">· AI tools + widget builder</text>
</g>

<!-- Divider -->
<g transform="translate(450 195)">
  <text x="0" y="0" font-family="'Space Grotesk', ui-monospace, monospace" font-size="14" fill="#8A8072" text-anchor="middle">=</text>
  <text x="0" y="20" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="middle" letter-spacing="1.5">SAME</text>
  <text x="0" y="34" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="middle" letter-spacing="1.5">SHAPE</text>
</g>

<!-- Card B -->
<g transform="translate(480 110)">
  <rect width="380" height="170" fill="none" stroke="#D9D0BD"/>
  <text x="20" y="30" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#B8532E" letter-spacing="1.2">CASE B · FIRECRAWL</text>
  <text x="20" y="60" font-family="'Literata', Georgia, serif" font-size="16" fill="#1A1815">Operator, can't write</text>
  <text x="20" y="82" font-family="'Literata', Georgia, serif" font-size="16" fill="#1A1815">production code</text>
  <text x="20" y="112" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">Built the internal tracking tool the third-party</text>
  <text x="20" y="128" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#6A6355">couldn't do. Shipped and used through launch.</text>
  <text x="20" y="158" font-family="'Literata', Georgia, serif" font-size="20" fill="#B8532E">~1 week</text>
  <text x="130" y="158" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#B8532E">· AI-assisted build</text>
</g>

<text x="40" y="305" font-family="'Literata', Georgia, serif" font-style="italic" font-size="13" fill="#6A6355">One story is anecdote. Two independent stories with the same shape is a pattern — and the pattern is the ceiling moving.</text>

</svg>