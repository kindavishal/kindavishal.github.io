<svg xmlns="http://www.w3.org/2000/svg" aria-label="Two operators, same pattern: Glean and Firecrawl" style="display:block;width:100%;height:auto;background:#f4efe6;border:1px solid #d9d0bd;border-radius:8px" viewBox="0 0 900 320"><text x="40" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" letter-spacing="1.5">TWO OPERATORS · DIFFERENT COMPANIES · DIFFERENT PROBLEMS</text><text x="40" y="80" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="22">When the same unusual thing happens twice, it&apos;s a pattern.</text><text x="860" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.5" text-anchor="end">MID-POST</text><path fill="none" stroke="#d9d0bd" d="M40 110h380v170H40z"/><text x="20" y="30" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2" transform="translate(40 110)">CASE A · GLEAN</text><text x="20" y="60" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="16" transform="translate(40 110)">Community manager,</text><text x="20" y="82" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="16" transform="translate(40 110)">no coding background</text><text x="20" y="112" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(40 110)">Redesigned an entire community experience —</text><text x="20" y="128" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(40 110)">work that used to need devs, designers, queues.</text><text x="20" y="158" fill="#b8532e" font-family="'Literata', Georgia, serif" font-size="20" transform="translate(40 110)">~2 weeks</text><text x="130" y="158" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" transform="translate(40 110)">· AI tools + widget builder</text><g fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" text-anchor="middle"><text font-size="14" transform="translate(450 195)">=</text><text y="20" font-size="10" letter-spacing="1.5" transform="translate(450 195)">SAME</text><text y="34" font-size="10" letter-spacing="1.5" transform="translate(450 195)">SHAPE</text></g><path fill="none" stroke="#d9d0bd" d="M480 110h380v170H480z"/><text x="20" y="30" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2" transform="translate(480 110)">CASE B · FIRECRAWL</text><text x="20" y="60" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="16" transform="translate(480 110)">Operator, can&apos;t write</text><text x="20" y="82" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="16" transform="translate(480 110)">production code</text><text x="20" y="112" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(480 110)">Built the internal tracking tool the third-party</text><text x="20" y="128" fill="#6a6355" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" transform="translate(480 110)">couldn&apos;t do. Shipped and used through launch.</text><text x="20" y="158" fill="#b8532e" font-family="'Literata', Georgia, serif" font-size="20" transform="translate(480 110)">~1 week</text><text x="130" y="158" fill="#b8532e" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" transform="translate(480 110)">· AI-assisted build</text><text x="40" y="305" fill="#6a6355" font-family="'Literata', Georgia, serif" font-size="13" font-style="italic">One story is anecdote. Two independent stories with the same shape is a pattern — and the pattern is the ceiling moving.</text></svg>