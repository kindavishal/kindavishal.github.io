<svg xmlns="http://www.w3.org/2000/svg" aria-label="State of DevRel 2023: 40.4% no formal budget; 43.4% lost staff in large-co layoffs; 34.2% under new metrics pressure; 36.2% felt vulnerable." style="display:block;width:100%;height:auto;background:#f4efe6;border:1px solid #d9d0bd;border-radius:8px" viewBox="0 0 900 460"><text x="40" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" letter-spacing="1.5">STATE OF DEVREL · 2023</text><text x="40" y="80" fill="#1a1815" font-family="'Literata', Georgia, serif" font-size="22">A team with no budget line has nothing to defend.</text><text x="860" y="42" fill="#8a8072" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.5" text-anchor="end">HERO</text><path fill="#f4efe6" stroke="#d9d0bd" d="M40 110h405v150H40z"/><text x="60" y="174" fill="#b8532e" font-family="'Literata', Georgia, serif" font-size="44">40.4%</text><text x="60" y="202" fill="#6a6355" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">NO FORMAL BUDGET</text><text x="60" y="228" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">…or didn&apos;t know what theirs was.</text><path fill="#f4efe6" stroke="#d9d0bd" d="M455 110h405v150H455z"/><text x="475" y="174" fill="#b8532e" font-family="'Literata', Georgia, serif" font-size="44">43.4%</text><text x="475" y="202" fill="#6a6355" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">LOST STAFF · LARGE COS</text><text x="475" y="228" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">DevRel teams cut in layoffs.</text><path fill="#f4efe6" stroke="#d9d0bd" d="M40 270h405v150H40z"/><text x="60" y="334" fill="#6a6355" font-family="'Literata', Georgia, serif" font-size="44">34.2%</text><text x="60" y="362" fill="#6a6355" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">NEW PRESSURE TO SHOW METRICS</text><text x="60" y="388" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">…that the programme wasn&apos;t set up to produce.</text><path fill="#f4efe6" stroke="#d9d0bd" d="M455 270h405v150H455z"/><text x="475" y="334" fill="#6a6355" font-family="'Literata', Georgia, serif" font-size="44">36.2%</text><text x="475" y="362" fill="#6a6355" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" letter-spacing="1.2">FELT VULNERABLE</text><text x="475" y="388" fill="#1a1815" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12">Job-stability concern in the same survey.</text></svg>