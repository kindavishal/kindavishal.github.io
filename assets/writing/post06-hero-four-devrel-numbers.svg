<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="State of DevRel 2023: 40.4% no formal budget; 43.4% lost staff in large-co layoffs; 34.2% under new metrics pressure; 36.2% felt vulnerable." style="display:block;width:100%;height:auto;background:#F4EFE6;border:1px solid #D9D0BD;border-radius:8px">

<text x="40" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="11" fill="#8A8072" letter-spacing="1.5">STATE OF DEVREL · 2023</text>
<text x="40" y="80" font-family="'Literata', Georgia, serif" font-size="22" fill="#1A1815">A team with no budget line has nothing to defend.</text>
<text x="860" y="42" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#8A8072" text-anchor="end" letter-spacing="1.5">HERO</text>
<rect x="40" y="110" width="405" height="150" fill="#F4EFE6" stroke="#D9D0BD"/><text x="60" y="174" font-family="'Literata', Georgia, serif" font-size="44" fill="#B8532E">40.4%</text><text x="60" y="202" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#6A6355" letter-spacing="1.2">NO FORMAL BUDGET</text><text x="60" y="228" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">…or didn't know what theirs was.</text><rect x="455" y="110" width="405" height="150" fill="#F4EFE6" stroke="#D9D0BD"/><text x="475" y="174" font-family="'Literata', Georgia, serif" font-size="44" fill="#B8532E">43.4%</text><text x="475" y="202" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#6A6355" letter-spacing="1.2">LOST STAFF · LARGE COS</text><text x="475" y="228" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">DevRel teams cut in layoffs.</text><rect x="40" y="270" width="405" height="150" fill="#F4EFE6" stroke="#D9D0BD"/><text x="60" y="334" font-family="'Literata', Georgia, serif" font-size="44" fill="#6A6355">34.2%</text><text x="60" y="362" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#6A6355" letter-spacing="1.2">NEW PRESSURE TO SHOW METRICS</text><text x="60" y="388" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">…that the programme wasn't set up to produce.</text><rect x="455" y="270" width="405" height="150" fill="#F4EFE6" stroke="#D9D0BD"/><text x="475" y="334" font-family="'Literata', Georgia, serif" font-size="44" fill="#6A6355">36.2%</text><text x="475" y="362" font-family="'Space Grotesk', ui-monospace, monospace" font-size="10" fill="#6A6355" letter-spacing="1.2">FELT VULNERABLE</text><text x="475" y="388" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" fill="#1A1815">Job-stability concern in the same survey.</text>

